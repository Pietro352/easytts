<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easyTTS</title>
    <meta name="description" content="easyTTS: trasforma il testo in voce, gratis. Scarica in MP3 o WAV. Made By HappyDev.">
    <meta name="theme-color" content="#111214">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111214'/%3E%3Crect x='14' y='26' width='6' height='12' rx='3' fill='%23ececea'/%3E%3Crect x='25' y='18' width='6' height='28' rx='3' fill='%23ececea'/%3E%3Crect x='36' y='22' width='6' height='20' rx='3' fill='%23e9b35f'/%3E%3Crect x='47' y='28' width='6' height='8' rx='3' fill='%23ececea'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #111214;
            --surface: #17181b;
            --line: #26282c;
            --text: #ececea;
            --muted: #8d9097;
            --amber: #e9b35f;
            --error: #e5806b;
            --font: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            padding: 0 clamp(20px, 5vw, 48px);
            -webkit-font-smoothing: antialiased;
        }

        .wrap { max-width: 760px; margin: 0 auto; }
        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
        .hidden { display: none !important; }

        header { padding: clamp(48px, 9vw, 96px) 0 clamp(28px, 5vw, 44px); }

        h1 {
            font-size: clamp(3rem, 11vw, 5.5rem);
            font-weight: 600;
            letter-spacing: -0.045em;
            line-height: 0.95;
            margin-bottom: 18px;
        }
        h1 span { color: var(--amber); }

        .subtitle { font-size: clamp(1rem, 2vw, 1.15rem); color: var(--muted); max-width: 40ch; }

        .card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .panel { padding: clamp(18px, 3vw, 26px); }

        textarea {
            display: block; width: 100%; min-height: 200px; resize: vertical;
            font: inherit; font-size: 1.05rem; line-height: 1.55;
            color: var(--text); background: var(--bg);
            border: 1px solid var(--line); border-radius: 10px;
            padding: 16px 18px; transition: border-color 0.2s ease;
        }
        textarea::placeholder { color: #5b5e65; }
        textarea:focus { outline: none; border-color: var(--amber); }

        .meta { display: flex; justify-content: space-between; gap: 12px; margin: 8px 2px 0; font-size: 0.85rem; color: var(--muted); }

        .controls { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; align-items: end; }
        .field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 220px; min-width: 0; }
        .field label { font-size: 0.85rem; color: var(--muted); }

        select {
            font: inherit; font-size: 0.98rem; color: var(--text);
            background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
            padding: 11px 12px; width: 100%; cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--amber); }
        input[type=range] { width: 100%; accent-color: var(--amber); height: 42px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font: inherit; font-weight: 600; font-size: 1rem;
            padding: 12px 22px; border-radius: 10px; cursor: pointer;
            border: 1px solid var(--line); background: var(--bg); color: var(--text);
            transition: filter 0.2s ease, transform 0.2s ease, background 0.2s ease;
        }
        .btn:hover:not(:disabled) { background: var(--surface); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: progress; }
        .btn.primary { background: var(--amber); border-color: var(--amber); color: #16130c; }
        .btn.primary:hover:not(:disabled) { background: var(--amber); filter: brightness(1.08); }

        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        .actions .primary { flex: 1 1 200px; }

        .progress { margin-top: 18px; }
        .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
        .bar i { display: block; height: 100%; width: 35%; background: var(--amber); }
        .bar.indeterminate i { animation: slide 1.1s ease-in-out infinite; }
        @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
        .status { margin-top: 8px; font-size: 0.9rem; color: var(--muted); }
        .status.error { color: var(--error); }

        .result { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
        audio { width: 100%; height: 44px; color-scheme: dark; }
        .dl { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .dl .btn { flex: 1 1 160px; }

        .note { margin-top: 18px; font-size: 0.88rem; color: var(--muted); max-width: 62ch; }

        footer {
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px;
            padding: 36px 0 44px; font-size: 0.9rem; color: var(--muted);
        }
        footer a { color: var(--text); border-bottom: 1px solid var(--line); transition: border-color 0.2s ease; }
        footer a:hover { border-color: var(--amber); }

        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>easy<span>TTS</span></h1>
        <p class="subtitle">Scrivi un testo, ascoltalo e scaricalo in MP3 o WAV. Gratis, senza account.</p>
    </header>

    <main class="card">
        <div class="panel">
            <textarea id="text" placeholder="Scrivi o incolla qui il testo da trasformare in voce…" spellcheck="false" autofocus></textarea>
            <div class="meta"><span id="count">0 caratteri</span><span>Ctrl + Invio per generare</span></div>

            <div class="controls">
                <div class="field">
                    <label for="voice">Voce</label>
                    <select id="voice">
                        <optgroup label="Italiano">
                            <option value="it-IT-IsabellaNeural">Isabella · donna</option>
                            <option value="it-IT-ElsaNeural">Elsa · donna</option>
                            <option value="it-IT-DiegoNeural">Diego · uomo</option>
                            <option value="it-IT-GiuseppeMultilingualNeural">Giuseppe · uomo (multilingue)</option>
                        </optgroup>
                        <optgroup label="English">
                            <option value="en-US-AvaMultilingualNeural">Ava · woman (US)</option>
                            <option value="en-US-AndrewMultilingualNeural">Andrew · man (US)</option>
                            <option value="en-GB-SoniaNeural">Sonia · woman (UK)</option>
                            <option value="en-GB-RyanNeural">Ryan · man (UK)</option>
                        </optgroup>
                        <optgroup label="Español">
                            <option value="es-ES-ElviraNeural">Elvira · mujer</option>
                            <option value="es-ES-AlvaroNeural">Álvaro · hombre</option>
                        </optgroup>
                        <optgroup label="Français">
                            <option value="fr-FR-DeniseNeural">Denise · femme</option>
                            <option value="fr-FR-HenriNeural">Henri · homme</option>
                        </optgroup>
                        <optgroup label="Deutsch">
                            <option value="de-DE-KatjaNeural">Katja · Frau</option>
                            <option value="de-DE-ConradNeural">Conrad · Mann</option>
                        </optgroup>
                    </select>
                </div>
                <div class="field">
                    <label for="rate">Velocità <span id="ratev">1.0×</span></label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>

            <div class="actions">
                <button class="btn primary" id="go">Genera audio</button>
            </div>

            <div class="progress hidden" id="progress">
                <div class="bar" id="bar"><i></i></div>
                <div class="status" id="status"></div>
            </div>

            <div class="result hidden" id="result">
                <audio id="player" controls></audio>
                <div class="dl">
                    <button class="btn" id="dl-mp3">Scarica MP3</button>
                    <button class="btn" id="dl-wav">Scarica WAV</button>
                </div>
            </div>

            <p class="note">Voci neurali naturali, gratis e senza account. Il testo viene inviato al servizio vocale solo per generare l’audio e non viene salvato.</p>
        </div>
    </main>

    <footer>
        <span>Made By HappyDev</span>
        <span><a href="https://github.com/Pietro352" target="_blank" rel="noopener">GitHub</a> · <a href="https://clickio.vercel.app/">click.io</a></span>
    </footer>
</div>

<script>
const API = 'https://clickio.vercel.app/api/tts';
const $ = (s) => document.querySelector(s);
const els = {
    text: $('#text'), count: $('#count'), voice: $('#voice'), rate: $('#rate'), go: $('#go'),
    progress: $('#progress'), bar: $('#bar'), status: $('#status'),
    result: $('#result'), player: $('#player'), mp3: $('#dl-mp3'), wav: $('#dl-wav'),
};
const store = {
    get: (k) => { try { return localStorage.getItem('easytts:' + k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem('easytts:' + k, v); } catch {} },
};

els.text.value = store.get('text') || '';
const updateCount = () => {
    const n = els.text.value.length;
    els.count.textContent = n.toLocaleString('it-IT') + (n === 1 ? ' carattere' : ' caratteri');
    store.set('text', els.text.value);
};
els.text.addEventListener('input', updateCount);
updateCount();

const savedVoice = store.get('voice2');
if (savedVoice && [...els.voice.options].some((o) => o.value === savedVoice)) els.voice.value = savedVoice;
els.voice.addEventListener('change', () => store.set('voice2', els.voice.value));
els.rate.addEventListener('input', () => { $('#ratev').textContent = Number(els.rate.value).toFixed(1) + '×'; });

function showStatus(msg, { error = false, busy = false } = {}) {
    els.progress.classList.remove('hidden');
    els.status.textContent = msg;
    els.status.classList.toggle('error', error);
    els.bar.classList.toggle('hidden', error);
    els.bar.classList.toggle('indeterminate', busy);
}

/* Divide il testo in parti, spezzando a fine frase */
function splitText(text, max = 1000) {
    const parts = [];
    let rest = text.replace(/\r/g, '').trim();
    while (rest.length > max) {
        let cut = -1;
        for (const re of [/[.!?…]["»”’)]*\s/g, /[;:,]\s/g, /\s/g]) {
            let m, last = -1;
            re.lastIndex = 0;
            while ((m = re.exec(rest.slice(0, max))) !== null) last = m.index + m[0].length;
            if (last > max * 0.4) { cut = last; break; }
        }
        if (cut < 0) cut = max;
        parts.push(rest.slice(0, cut).trim());
        rest = rest.slice(cut).trim();
    }
    if (rest) parts.push(rest);
    return parts.filter(Boolean);
}

async function synth(text, voice, rate) {
    let lastErr;
    for (let attempt = 0; attempt < 2; attempt++) {
        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice, rate }),
            });
            if (!res.ok) {
                let msg = 'Errore ' + res.status;
                try { msg = (await res.json()).error || msg; } catch {}
                throw new Error(msg);
            }
            return await res.arrayBuffer();
        } catch (err) { lastErr = err; }
    }
    throw lastErr;
}

/* ---------- WAV ---------- */
async function mp3ToWav(blob) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    try {
        const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
        const len = buf.length, chs = buf.numberOfChannels, sr = buf.sampleRate;
        const pcm = new Int16Array(len * chs);
        for (let c = 0; c < chs; c++) {
            const d = buf.getChannelData(c);
            for (let i = 0; i < len; i++) pcm[i * chs + c] = Math.max(-1, Math.min(1, d[i])) * 32767;
        }
        const bytes = pcm.length * 2, v = new DataView(new ArrayBuffer(44 + bytes));
        const w = (o, t) => [...t].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
        w(0, 'RIFF'); v.setUint32(4, 36 + bytes, true); w(8, 'WAVE'); w(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, chs, true);
        v.setUint32(24, sr, true); v.setUint32(28, sr * 2 * chs, true);
        v.setUint16(32, 2 * chs, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, bytes, true);
        new Int16Array(v.buffer, 44).set(pcm);
        return new Blob([v], { type: 'audio/wav' });
    } finally { ctx.close(); }
}

/* ---------- Genera ---------- */
let lastMp3 = null, lastWav = null, audioUrl = null;

async function generate() {
    const text = els.text.value.trim();
    if (!text) { showStatus('Scrivi prima un testo.', { error: true }); els.text.focus(); return; }
    const parts = splitText(text);
    const rate = Math.round((Number(els.rate.value) - 1) * 100);
    els.go.disabled = true;
    els.result.classList.add('hidden');
    els.player.pause();
    try {
        const chunks = [];
        for (let i = 0; i < parts.length; i++) {
            showStatus(parts.length > 1 ? `Genero la voce… parte ${i + 1} di ${parts.length}` : 'Genero la voce…', { busy: true });
            chunks.push(await synth(parts[i], els.voice.value, rate));
        }
        lastMp3 = new Blob(chunks, { type: 'audio/mpeg' });
        lastWav = null;
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(lastMp3);
        els.player.src = audioUrl;
        els.progress.classList.add('hidden');
        els.result.classList.remove('hidden');
        els.player.play().catch(() => {});
    } catch (err) {
        console.error(err);
        showStatus('Errore: ' + (err && err.message ? err.message : 'impossibile generare l’audio.') + ' Controlla la connessione e riprova.', { error: true });
    } finally {
        els.go.disabled = false;
    }
}
els.go.onclick = generate;
els.text.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); generate(); }
});

/* ---------- Download ---------- */
function save(blob, ext) {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    const name = `easyTTS-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
els.mp3.onclick = () => { if (lastMp3) save(lastMp3, 'mp3'); };
els.wav.onclick = async () => {
    if (!lastMp3) return;
    els.wav.disabled = true;
    const label = els.wav.textContent;
    els.wav.textContent = 'Preparo WAV…';
    try {
        if (!lastWav) lastWav = await mp3ToWav(lastMp3);
        save(lastWav, 'wav');
    } catch (err) {
        console.error(err);
        showStatus('Errore nella creazione del WAV: ' + err.message, { error: true });
    } finally {
        els.wav.textContent = label;
        els.wav.disabled = false;
    }
};
</script>
</body>
</html>
